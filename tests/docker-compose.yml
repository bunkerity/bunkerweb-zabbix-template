name: bunkerweb-zabbix-template-test

services:
  metrics:
    image: nginx:1.28.2-alpine-slim@sha256:8393e91e100dcda823dcdd5f7d08e3e1be61670c41b513c612d2f80913a46a83
    volumes:
      - ./metrics.prom:/usr/share/nginx/html/metrics:ro

  database:
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_DB: zabbix
      POSTGRES_PASSWORD: zabbix
      POSTGRES_USER: zabbix
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zabbix"]
      interval: 2s
      timeout: 5s
      retries: 30

  server:
    image: zabbix/zabbix-server-pgsql:alpine-7.0-latest@sha256:e3610e5b9033b95a74014813784fd503b73b981e6953358ec533091b3426d581
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB_SERVER_HOST: database
      POSTGRES_DB: zabbix
      POSTGRES_PASSWORD: zabbix
      POSTGRES_USER: zabbix

  web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0-latest@sha256:f30732da18993807fb3b3d8571d179bb32b6e391d4e2ab82dd5e132ce33b3325
    depends_on:
      database:
        condition: service_healthy
      server:
        condition: service_started
    environment:
      DB_SERVER_HOST: database
      PHP_TZ: UTC
      POSTGRES_DB: zabbix
      POSTGRES_PASSWORD: zabbix
      POSTGRES_USER: zabbix
      ZBX_SERVER_HOST: server
    ports:
      - "127.0.0.1:18080:8080"
