name: bunkerweb-zabbix-template-test

services:
  metrics:
    image: nginx:1.28.2-alpine-slim@sha256:8393e91e100dcda823dcdd5f7d08e3e1be61670c41b513c612d2f80913a46a83
    volumes:
      - ./metrics.prom:/usr/share/nginx/html/metrics:ro

  database:
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_DB: zabbix
      POSTGRES_PASSWORD: zabbix
      POSTGRES_USER: zabbix
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zabbix"]
      interval: 2s
      timeout: 5s
      retries: 30

  server:
    image: zabbix/zabbix-server-pgsql:alpine-7.0-latest@sha256:ae22510b336b37bf0e721be418c69ee8cad35d432954eba5a0d298348771b71c
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB_SERVER_HOST: database
      POSTGRES_DB: zabbix
      POSTGRES_PASSWORD: zabbix
      POSTGRES_USER: zabbix

  web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0-latest@sha256:ca1d53da20cd56336c4f2b393f6b68b75e5bf53825a3ad4a9130e30ce8d334ca
    depends_on:
      database:
        condition: service_healthy
      server:
        condition: service_started
    environment:
      DB_SERVER_HOST: database
      PHP_TZ: UTC
      POSTGRES_DB: zabbix
      POSTGRES_PASSWORD: zabbix
      POSTGRES_USER: zabbix
      ZBX_SERVER_HOST: server
    ports:
      - "127.0.0.1:18080:8080"
